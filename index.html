<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Конструктор схем сети для homelab и небольших офисов: устройства, IP и MAC-адреса, связи, группы и VPN-туннели."
    />
    <meta name="theme-color" content="#070b13" />
    <script>
      ;(() => {
        try {
          const theme = window.localStorage.getItem('homelab-theme')
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.dataset.theme = theme
            document
              .querySelector('meta[name="theme-color"]')
              ?.setAttribute('content', theme === 'light' ? '#eef2f8' : '#070b13')
          } else {
            document.documentElement.dataset.theme = 'dark'
          }
        } catch {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <title>Homelab Map — конструктор схем сети</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
